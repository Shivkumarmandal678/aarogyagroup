<style>
    .ag-navbar {
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(12px);
    }

    .ag-brand {
        color: #17211b;
        font-size: 1.15rem;
        letter-spacing: 0.01em;
    }

    .ag-brand:hover { color: #17211b; }

    .ag-brand-mark {
        display: inline-grid;
        width: 2.25rem;
        height: 2.25rem;
        place-items: center;
        margin-right: 0.5rem;
        border-radius: 0.75rem;
        background: #d1fae5;
        color: #059669;
    }

    .ag-nav-link {
        position: relative;
        padding: 0.65rem 0.9rem !important;
        color: #475569 !important;
        font-weight: 600;
        border-radius: 0.5rem;
    }

    .ag-nav-link:hover,
    .ag-nav-link:focus,
    .ag-nav-link.active {
        color: #059669 !important;
        background: #ecfdf5;
    }

    @media (min-width: 992px) {
        .ag-nav-link.active::after {
            position: absolute;
            right: 0.9rem;
            bottom: 0.2rem;
            left: 0.9rem;
            height: 2px;
            background: #10b981;
            content: "";
        }
    }

    .ag-navbar .navbar-toggler {
        padding: 0.45rem 0.6rem;
        border-color: #d1d5db;
    }

    .ag-navbar .navbar-toggler:focus { box-shadow: 0 0 0 0.2rem rgba(16, 185, 129, 0.2); }

    @media (max-width: 991.98px) {
        .ag-navbar .navbar-collapse {
            margin-top: 0.75rem;
            padding: 0.5rem;
            border-top: 1px solid #e5e7eb;
        }

        .ag-nav-link { margin: 0.15rem 0; }
    }
</style>

<nav class="navbar navbar-expand-lg ag-navbar border-bottom sticky-top" aria-label="Main navigation">
    <div class="container py-2">
        <a class="navbar-brand ag-brand d-flex align-items-center" href="{% url 'home' %}">
            <span class="ag-brand-mark"><i class="bi bi-shield-check" aria-hidden="true"></i></span>
            <span><span class="text-ag-green">Aarogya</span> Group</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link ag-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link ag-nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'about' %}">About</a></li>
                <li class="nav-item"><a class="nav-link ag-nav-link {% if request.resolver_match.url_name == 'service' %}active{% endif %}" href="{% url 'service' %}">Service</a></li>
            </ul>
        </div>
    </div>
</nav>
