{% extends 'base.html' %}

{% block title %}User Portal | Aarogya Group{% endblock %}

{% block content %}
<div class="container py-5">
  {% include 'messages.html' %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 p-md-5 text-center border-0 shadow rounded-4 bg-white">
        <img src="{{ user.profile_image }}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" alt="User" style="width: 110px; height: 110px; border-radius: 50%; border: 4px solid #18a673; object-fit: cover;" class="mx-auto mb-3">
        <h3 class="fw-bold text-dark mb-1">{{ user.username }}</h3>
        <span class="badge bg-success bg-opacity-10 text-success px-3 py-1 mb-2 fs-6">{{ user.role }}</span>
        <p class="text-muted small mb-4">{{ user.email }}</p>

        <div class="d-grid gap-2">
          <a href="{% url 'booking' %}" class="btn btn-success rounded-pill py-2"><i class="bi bi-calendar-plus me-1"></i> New Booking Appointment</a>
          <button class="btn btn-outline-primary rounded-pill py-2" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="bi bi-key me-1"></i> Change Password</button>
          <a href="{% url 'admin_logout' %}" class="btn btn-outline-danger rounded-pill py-2"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow">
      <form method="POST" action="{% url 'admin_change_password' %}">
        {% csrf_token %}
        <div class="modal-header border-0 bg-light"><h5 class="modal-title fw-bold">Change Password</h5></div>
        <div class="modal-body p-4">
          <input type="password" name="new_password" class="form-control mb-3" placeholder="New Password" required>
          <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
        </div>
        <div class="modal-footer border-0 bg-light">
          <button type="submit" class="btn btn-primary rounded-pill">Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
