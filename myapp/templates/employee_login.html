{% extends "base.html" %}
{% block title %}Employee Login | Aarogya Group{% endblock %}
{% block content %}
<section class="py-5 bg-light">
    <div class="container" style="max-width: 480px;">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4"><i class="bi bi-briefcase text-ag-green display-5"></i><h1 class="h3 fw-bold mt-3">Employee Login</h1><p class="text-secondary">Sign in to manage workers and appointments.</p></div>
                {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
                <form method="post" action="{% url 'employee_login' %}">
                    {% csrf_token %}
                    <label class="form-label fw-semibold" for="username">Username</label>
                    <input class="form-control mb-3" id="username" name="username" type="text" autocomplete="username" required autofocus>
                    <label class="form-label fw-semibold" for="password">Password</label>
                    <input class="form-control mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
                    <button class="btn btn-ag-green w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
