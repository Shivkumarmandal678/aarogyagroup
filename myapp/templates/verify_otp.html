{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card p-4 shadow-lg border-0 rounded-4 mt-5">
      <h4 class="text-center">Enter OTP</h4>
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <input type="text" name="otp" class="form-control text-center fs-4" placeholder="6-Digit OTP" required>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold">Verify OTP</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
