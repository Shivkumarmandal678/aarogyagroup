{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-lg border-0 rounded-4 p-4 mt-5">
      <h3 class="text-center font-weight-bold text-primary mb-3"><i class="fa-solid fa-right-to-bracket"></i> Login</h3>
      {% include 'messages.html' %}
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-pill">Login</button>
      </form>
      <div class="text-between mt-3 d-flex justify-content-between">
        <a href="{% url 'forgot_password' %}" class="small text-danger">Forgot Password?</a>
        <a href="{% url 'register' %}" class="small text-primary">Create Account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
