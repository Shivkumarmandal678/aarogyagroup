<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Aarogya Group{% endblock %}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<style>
		:root {
			--ag-green: #176b5b;
			--ag-ink: #173b3a;
			--ag-mint: #e7f3ed;
		}

		body { color: var(--ag-ink); }
		.navbar-brand, .text-ag-green { color: var(--ag-green) !important; }
		.btn-ag-green { background: var(--ag-green); border-color: var(--ag-green); color: #fff; }
		.btn-ag-green:hover { background: #0f5145; border-color: #0f5145; color: #fff; }
		.context-menu {
			position: fixed;
			z-index: 1055;
			display: none;
			min-width: 190px;
			padding: .4rem;
			background: #fff;
			border: 1px solid rgba(23, 59, 58, .12);
			border-radius: .5rem;
			box-shadow: 0 .75rem 2rem rgba(23, 59, 58, .18);
		}
		.context-menu.is-visible { display: block; }
		.context-menu button { width: 100%; border: 0; background: transparent; text-align: left; border-radius: .3rem; padding: .55rem .7rem; }
		.context-menu button:hover { background: var(--ag-mint); color: var(--ag-green); }
		.navbar.is-hidden { display: none; }
		.show-navigation { display: none; }
		.show-navigation.is-visible { display: inline-flex; }
	</style>
	{% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
	<nav id="mainNavbar" class="navbar navbar-expand-lg bg-white border-bottom">
		<div class="container">
			<a class="navbar-brand fw-semibold" href="{% url 'home' %}">Aarogya Group</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="mainNavigation">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item">
						<a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>
	<div class="container d-flex justify-content-end pt-3">
		<button id="showNavigation" class="show-navigation btn btn-sm btn-outline-success" type="button">Show navigation</button>
	</div>

	<main>
		{% block content %}{% endblock %}
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<div id="pageContextMenu" class="context-menu" role="menu" aria-label="Page options">
		<button id="hideNavigation" type="button" role="menuitem">Hide navigation</button>
	</div>
	<script>
		const contextMenu = document.getElementById('pageContextMenu');
		const navigation = document.getElementById('mainNavbar');
		const hideNavigation = document.getElementById('hideNavigation');
		const showNavigation = document.getElementById('showNavigation');

		document.addEventListener('contextmenu', (event) => {
			event.preventDefault();
			contextMenu.style.left = `${Math.min(event.clientX, window.innerWidth - 205)}px`;
			contextMenu.style.top = `${Math.min(event.clientY, window.innerHeight - 60)}px`;
			contextMenu.classList.add('is-visible');
		});

		document.addEventListener('click', () => contextMenu.classList.remove('is-visible'));
		hideNavigation.addEventListener('click', () => {
			navigation.classList.add('is-hidden');
			showNavigation.classList.add('is-visible');
		});
		showNavigation.addEventListener('click', () => {
			navigation.classList.remove('is-hidden');
			showNavigation.classList.remove('is-visible');
		});
	</script>
	{% block extra_js %}{% endblock %}
</body>
</html>
