<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Aarogya Group - Worker & Employer Platform{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --ag-green: #10b981;
            --ag-dark-green: #059669;
            --ag-light-green: #d1fae5;
            --ag-blue: #3b82f6;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .btn-ag-green {
            background-color: var(--ag-green);
            border-color: var(--ag-green);
            color: white;
        }
        
        .btn-ag-green:hover {
            background-color: var(--ag-dark-green);
            border-color: var(--ag-dark-green);
            color: white;
        }
        
        .text-ag-green {
            color: var(--ag-green);
        }
        
        .bg-ag-light {
            background-color: var(--ag-light-green);
        }
        
        main {
            min-height: calc(100vh - 200px);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
    <!-- Include Navbar -->
    {% include 'navbar.html' %}

    <!-- Main Content Area -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Include Footer -->
    {% include 'footer.html' %}

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
