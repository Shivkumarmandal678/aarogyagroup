{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-lg border-0 rounded-4 p-4">
      <h3 class="text-center font-weight-bold text-success mb-3"><i class="fa-solid fa-user-plus"></i> Register</h3>
      <form method="POST">
        {% csrf_token %}
        <div class="mb-2"><label>Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="mb-2"><label>Email</label><input type="email" name="email" class="form-control" required></div>
        <div class="mb-2"><label>Mobile Number</label><input type="text" name="phone" class="form-control" required></div>
        <div class="mb-2"><label>Address</label><input type="text" name="address" class="form-control" required></div>
        <div class="mb-3"><label>Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-success w-100 rounded-pill">Send OTP & Register</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
