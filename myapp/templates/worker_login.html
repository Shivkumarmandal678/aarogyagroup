{% extends "base.html" %}

{% block title %}Worker Login | Aarogya Group{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container" style="max-width: 520px;">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-badge text-ag-green display-5"></i>
                    <h1 class="h3 fw-bold mt-3">Worker Login</h1>
                    <p class="text-secondary mb-0">Use the username and password assigned to you.</p>
                </div>
                {% if error %}
                    <div class="alert alert-warning" role="alert">{{ error }}</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control" id="username" name="username" type="text" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" name="password" type="password" required>
                    </div>
                    <button class="btn btn-ag-green w-100" type="submit">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
